<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AsciiDoc Web Editor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div>
        <h1>AsciiDoc Web Editor</h1>
        <p>GDGoC OMU Wiki</p>
      </div>
      <div class="actions">
        <select id="fileSelect" aria-label="編集するAsciiDocファイル"></select>
        <button id="newButton" type="button">New</button>
        <button id="saveButton" type="button">Save</button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane">
        <div class="paneHeader">
          <span>Editor</span>
          <span id="status" class="status">Loading...</span>
        </div>
        <div id="editor"></div>
      </section>

      <section class="pane">
        <div class="paneHeader">
          <span>Preview</span>
          <span id="currentFile" class="status"></span>
        </div>
        <article id="preview" class="preview"></article>
      </section>
    </main>

    <script>
      window.MonacoEnvironment = {
        getWorkerUrl() {
          return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
            self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/' };
            importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/base/worker/workerMain.js');
          `)}`;
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.49.0/min/vs/loader.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
